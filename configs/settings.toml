# Settings for the index, retrieval, the language model and the API.
# Environment variables override some of these at run time (see .env.example).
# Secrets (API keys) only ever come from the environment.

[paths]
index_dir = "data/processed/index"
sources_file = "configs/sources.toml"

[chunking]
# Sizes are counted in the embedding model's own tokens.
chunk_size_tokens = 160
chunk_overlap_tokens = 32
# Chunks shorter than this are dropped, such as a stray document title.
min_chunk_tokens = 8
# Paragraphs that share this share of their terms with an earlier paragraph are dropped.
duplicate_overlap = 0.8

[embedding]
# provider is onnx, sentence-transformers or fake (fake is for tests only).
provider = "onnx"
model_name = "sentence-transformers/all-MiniLM-L6-v2"
query_prefix = ""
batch_size = 32
# Local folder with the ONNX graph and tokenizer. Empty uses models/all-MiniLM-L6-v2.
model_dir = ""
# A short query needs few threads. Capping them avoids slowdowns on a shared or small CPU.
torch_threads = 2

[retrieval]
default_top_k = 8
max_top_k = 20
# How many dense and BM25 candidates go into fusion.
candidate_pool = 30
# Reciprocal rank fusion constant.
rrf_k = 60
# A chunk only enters fusion when it clears one of these bars,
# so an off topic question returns nothing instead of noise.
# Off topic probes top out near 0.30 dense similarity; short factual
# questions such as "What is his current role?" score from 0.33.
min_dense_similarity = 0.32
min_bm25_score = 3.5

[reranker]
# About 90 MB more memory and a few tens of milliseconds per question. RERANK=true turns it on.
enabled = false
model_name = "cross-encoder/ms-marco-MiniLM-L6-v2"

[llm]
# anthropic, openai, fake or auto. LLM_PROVIDER overrides it.
# auto uses Anthropic when ANTHROPIC_API_KEY is set, then OpenAI, then the offline fake.
provider = "auto"
# LLM_MODEL overrides the model of whichever provider is in use.
# LLM_REWRITE_MODEL overrides the model that rewrites follow up questions for retrieval.
anthropic_model = "claude-sonnet-5-5"
rewrite_model = "claude-haiku-5-5"
openai_model = "gpt-6-astra"
# Set to use any OpenAI compatible server (LLM_BASE_URL overrides it).
base_url = ""
# Room for a full answer. Answers are asked to stay near 100 to 150 words.
max_output_tokens = 1024

# Prices for models that are not in the built in table, in US dollars per million tokens.
# Unknown models are charged at the highest known price, so the spend cap stays safe.
# [llm.pricing."my-model"]
# input = 1.0
# output = 4.0

[guardrails]
monthly_budget_usd = 20.0
max_question_chars = 500
history_turns = 10
max_history_chars = 2000
usage_file = "data/usage.json"

[api]
host = "127.0.0.1"
port = 8070
