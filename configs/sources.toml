# The documents the index is built from, in priority order.
# When two sources say the same thing, the earlier source keeps the paragraph.
#
# file is the copy in raw_dir that the build reads. origin is where
# `make sources` copies it from, relative to origin_root (SOURCE_ROOT overrides it).

raw_dir = "data/raw"
origin_root = ".."

# Sections about installing or running code are skipped because visitors do not ask about them.
skipped_sections = [
    "run it",
    "setup",
    "load the news",
    "run the topic model",
    "repository layout",
    "project layout",
    "label export format",
    "sources",
    "quickstart",
    "configuration",
    "layout",
    "roadmap",
    "spark",
    "prefect",
    "code highlights",
    "tournament code highlights",
]

# Text fixes applied before chunking, for wording that is out of date in a source.
[[corrections]]
find = "I am a Lead Data Scientist."
replace = "I am a Lead Applied AI Scientist."

# The resume source still lists the old website.
[[corrections]]
find = "goldenoakresearch.com"
replace = "ajgeiger.com"

# The resume source still has the old summary. These match the published resume.
[[corrections]]
find = "Applied AI scientist with 9+ years"
replace = "Lead Applied AI Scientist with 9+ years"

[[corrections]]
find = "to deliver dynamic pricing and forecasting across 100+ locations, protecting millions in margin."
replace = "to deliver measurable net revenue."

[[sources]]
name = "Resume"
kind = "pdf"
file = "resume.pdf"
origin = "resume/Alexander_Geiger_Resume.pdf"

[[sources]]
name = "Resume source text"
kind = "python"
file = "resume_build.py"
origin = "resume/build.py"

