name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Tests use the fake embedding and fake language model, so no keys or downloads are needed.
      - name: Test
        run: pytest

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The client installs with httpx only
        run: |
          python -m pip install .
          python -c "from rag_chatbot_client import ChatbotClient; print(ChatbotClient)"
